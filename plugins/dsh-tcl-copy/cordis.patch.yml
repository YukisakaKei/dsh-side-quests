# dsh-tcl-copy bundle patch
#
# This file is the `dsh.bundle.patch` layer of the package. When installed
# through the official CLI:
#
#   dsh plugin --profile web add dsh-tcl-copy
#
# the command reconciles `dsh.profile.bundles` against installed packages and,
# seeing this declaration, appends the package to the bundle stack. The profile
# boot then merges this single `insert` of the plugin row. The client half is
# picked up automatically from the `dsh.client` + `exports` declarations in
# package.json — no profile file edits needed.
#
# Do not also add a manual mount line to the profile's cordis.patch.yml for this
# package — that would double-mount (two Node halves).
- insert:
    - id: dsh-tcl-copy
      name: 'dsh-tcl-copy'
